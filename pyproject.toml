[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlmd-exafs"
version = "0.1.0"
description = "MLIP molecular dynamics + FEFF EXAFS simulation workflow"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ase>=3.22",
    "numpy",
    "matplotlib",
    "scipy",
    "spglib",
]

[project.optional-dependencies]
# Install the MLIP backend(s) you intend to use as the MD force engine.
chgnet = ["chgnet"]
mace = ["mace-torch"]
orb = ["orb-models"]
uma = ["fairchem-core"]
sevennet = ["sevenn"]
# MCP server wrapper for MCP-capable orchestrators (Claude Code, Cline, Cursor).
mcp = ["mcp>=1.0"]    # server supports both the 1.x FastMCP and 2.x MCPServer APIs
# Test suite (offline; no MLIP backend or FEFF9 needed). MCP tests skip without mcp.
test = ["pytest>=7", "mcp>=1.0"]

[project.scripts]
mlmd-exafs = "mlmd_exafs.cli:main"
mlmd-exafs-mcp = "mlmd_exafs.mcp_server:main"

[tool.setuptools]
packages = ["mlmd_exafs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
